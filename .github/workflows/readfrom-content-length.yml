name: Focused Content-Length Regression

on:
  push:
    branches:
      - fix/compress-readfrom-content-length

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache: false

      - name: Run focused regression test
        run: go test -run TestCompressHandlerGzipReadFromDropsContentLength -count=1 -v ./...
